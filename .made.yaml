version: 1
agent: codex
review:
  required: true
ci:
  required: true
validation:
  lanes:
    go:
      paths:
        - "**/*.go"
        - "go.mod"
        - "go.sum"
      full:
        - "go build ./..."
        - "go test ./..."
        - "go test -race -shuffle=on -count=1 ./..."
        - "go vet ./..."
      required_before_push: true
commands:
  lint: golangci-lint run ./...
